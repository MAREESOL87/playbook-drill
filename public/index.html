<!DOCTYPE html>
<html lang="fr">
<head>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Même carnet qu'EA Trainer : papier froid, sarcelle, ambre pour ce qui est à revoir. */
  --bg:#f2f5f7; --surface:#ffffff; --ink:#16222d; --muted:#5d6c7a; --line:#d7dee5;
  --accent:#0e7268; --accent-ink:#ffffff; --accent-soft:#d6eeea;
  --warn:#a85a0a; --warn-soft:#fbe9cf; --good:#1a7a3f; --good-soft:#d9f0e1; --bad:#b42323; --bad-soft:#f9dede;
  --display:'Sora',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark;
    --bg:#0f161c; --surface:#172028; --ink:#e8edf1; --muted:#9aa8b4; --line:#2c3842;
    --accent:#3cc4b4; --accent-ink:#06211d; --accent-soft:#163b37;
    --warn:#f0b35e; --warn-soft:#3b2a12; --good:#5fd38a; --good-soft:#143322; --bad:#ff7b7b; --bad-soft:#3d1a1a; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
h1{font-family:var(--display);font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-0.01em;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:.95rem}
nav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav button:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-family:var(--display);font-size:1.2rem;font-weight:600;margin:0 0 10px;text-wrap:balance}
h3{font-family:var(--display);font-size:1rem;font-weight:600;margin:18px 0 6px}
p{margin:0 0 10px;max-width:65ch}
ul,ol{margin:0 0 12px;padding-left:22px;max-width:65ch}
li{margin-bottom:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:12px}
.card.accent{border-color:var(--accent);background:linear-gradient(0deg,var(--accent-soft),var(--surface))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:.9rem}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.big{padding:14px 18px;font-size:1.05rem;width:100%;margin-top:8px}
.btn.ghost{width:100%;margin-top:8px}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.soft{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .n{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.1}
.tile .l{color:var(--muted);font-size:.85rem}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin:8px 0;font:inherit;font-size:.97rem;line-height:1.4;color:var(--ink);cursor:pointer}
.opt:active{background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt.mid{border-color:var(--warn);background:var(--warn-soft)}
.opt.dim{opacity:.55}
.timer{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 14px}
.timer i{display:block;height:100%;background:var(--accent);width:100%;transition:width .95s linear}
.timer.warn i{background:var(--bad)}
.fb{border-left:3px solid var(--line);padding:8px 12px;margin:12px 0;font-size:.95rem}
.fb.ok{border-color:var(--good)} .fb.ko{border-color:var(--bad)} .fb.mid{border-color:var(--warn)}
.data{font-family:var(--mono);font-size:.9rem;background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin:10px 0;white-space:pre-line}
.prog{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.bars .b{margin:9px 0}
.bars .b .l{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:4px}
.bars .b .t{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bars .b .t i{display:block;height:100%;background:var(--accent)}
.bars .b .t i.lo{background:var(--bad)} .bars .b .t i.md{background:var(--warn)}
.hist{display:flex;align-items:flex-end;gap:4px;height:60px;margin-top:8px}
.hist i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.85}
.score{font-family:var(--display);font-size:2.8rem;font-weight:700;line-height:1;margin:6px 0 2px}
.brief{white-space:pre-line}
.step{font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.85rem;color:var(--muted);font-weight:600}
input[type=text]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.92rem}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="row" style="justify-content:space-between;align-items:baseline">
    <h1>Playbook Drill</h1>
    <span class="pill soft" id="sync-pill" title="Où est enregistrée ta progression">Progression : cet appareil</span>
  </div>
  <p class="sub">Entraînement analytique : les règles du Playbook jusqu'au réflexe.</p>
</header>

<nav role="tablist" aria-label="Sections">
  <button role="tab" data-v="home" aria-selected="true">Aujourd'hui</button>
  <button role="tab" data-v="drill" aria-selected="false">Drill</button>
  <button role="tab" data-v="cas" aria-selected="false">Cas</button>
  <button role="tab" data-v="stats" aria-selected="false">Progression</button>
</nav>

<main id="app"></main>
</div>

<script>
/* ===================== DONNÉES ===================== */
/* Première option = bonne réponse (mélangées à l'affichage). t = secondes. Nouveau contenu chaque lundi. */
const CATS={
  fam:{n:"Familles du Playbook",s:"Familles"},
  cad:{n:"Cadrage",s:"Cadrage"},
  pct:{n:"Points vs pourcents",s:"Calcul"},
  alt:{n:"Fausse alternative",s:"Alternative"},
  obs:{n:"Attribut observable vs cause supposée",s:"Observable"},
  ind:{n:"Contenu de l'indicateur",s:"Indicateur"},
  par:{n:"Parcimonie",s:"Parcimonie"},
  seq:{n:"Séquençage",s:"Séquençage"}
};
// Première option = bonne réponse (mélangées à l'affichage). t = secondes.
const Q=[
// Familles
{id:"f1",cat:"fam",t:30,q:"Famille Cadrage : quelle question t'impose-t-elle ?",o:["Quelle est la question causale, indépendamment de la solution qu'on me propose ?","Quelle donnée tuerait mon hypothèse ?","Ce chiffre masque-t-il un sous-groupe ?","Qu'est-ce qui est gratuit à vérifier avant de comparer ?"],w:"Ne jamais hériter du cadre de celui qui pose le problème. La solution proposée est une hypothèse parmi d'autres."},
{id:"f2",cat:"fam",t:30,q:"Famille Falsifiabilité : quelle question t'impose-t-elle ?",o:["Quelle donnée tuerait mon hypothèse, et explique-t-elle tous les faits avec un seul récit ?","Quelle est la question causale ?","Que contient exactement ce chiffre ?","Que dois-je éliminer avant de comparer ?"],w:"Une hypothèse sans donnée qui la tue est une étiquette. Et une cause valable explique tous les faits observés, pas un seul."},
{id:"f3",cat:"fam",t:30,q:"Famille Qualité de la donnée : quelle question t'impose-t-elle ?",o:["Que contient exactement ce chiffre, et masque-t-il un sous-groupe ?","Quelle donnée tuerait mon hypothèse ?","Quelle solution me propose-t-on ?","Qu'est-ce qui est gratuit à vérifier ?"],w:"Le 3,8 % de churn masquait une cohorte ; la marge de 55 % masquait 5 magasins ; la marge brute ne contient pas les salaires."},
{id:"f4",cat:"fam",t:30,q:"Famille Séquençage : quelle question t'impose-t-elle ?",o:["Qu'est-ce que je dois éliminer, gratuitement, avant de comparer quoi que ce soit ?","Quelle est la question causale ?","Mon hypothèse est-elle réfutable ?","Ce chiffre masque-t-il un sous-groupe ?"],w:"Le churn du Sud en N-1 éliminait trois hypothèses d'un coup, gratuitement, avant toute comparaison régionale."},
{id:"f5",cat:"fam",t:40,q:"« Ces clients perdent l'intérêt pour la solution. » Quelle famille cette hypothèse viole-t-elle ?",o:["Falsifiabilité","Cadrage","Séquençage","Qualité de la donnée"],w:"Aucune donnée ne peut la tuer : elle décrit le départ sans l'expliquer. C'est une étiquette, pas une hypothèse."},
{id:"f6",cat:"fam",t:40,q:"« Le churn est de 3,8 %, le problème touche donc toute la base. » Quelle famille est violée ?",o:["Qualité de la donnée","Cadrage","Falsifiabilité","Séquençage"],w:"Un agrégat ne dit rien de sa composition. Avant de conclure sur l'ensemble, vérifier si un sous-groupe porte l'écart."},
{id:"f7",cat:"fam",t:40,q:"« Le fondateur veut baisser les prix ; calculons l'impact sur le revenu. » Quelle famille est violée ?",o:["Cadrage","Parcimonie","Séquençage","Qualité de la donnée"],w:"La solution du fondateur est devenue l'objectif de l'analyse. La question causale n'a jamais été posée."},
{id:"f8",cat:"fam",t:30,q:"Combien de familles compte le Playbook ?",o:["4 : cadrage, falsifiabilité, qualité de la donnée, séquençage","3 : cadrage, données, décision","5 : cadrage, hypothèses, données, séquençage, décision","8 : une par règle"],w:"Quatre familles, douze règles maximum. Au-delà, toute règle nouvelle en remplace une."},
// Cadrage
{id:"c1",cat:"cad",t:50,q:"« Le beurre a pris 18 %, je monte les prix de 8 %, prépare l'argumentaire. » Ta reformulation :",o:["Qu'est-ce qui explique la baisse de marge, et une hausse de prix traite-t-elle cette cause ?","De combien faut-il monter les prix pour restaurer la marge ?","Comment faire accepter la hausse aux équipes ?","Le coût matière justifie-t-il 8 % de hausse ?"],w:"Ouverte sur la cause, fermée sur le fait à expliquer. Les trois autres héritent du cadre du fondateur."},
{id:"c2",cat:"cad",t:40,q:"Le fondateur arrive avec une solution. Le risque principal pour l'analyste :",o:["Hériter de son cadre et ne tester qu'une seule cause","Le vexer en remettant en cause son analyse","Perdre du temps à reformuler","Sous-estimer son intuition du terrain"],w:"Sa solution encode une hypothèse causale implicite. L'adopter, c'est renoncer à tester les autres."},
{id:"c3",cat:"cad",t:40,q:"Une bonne question analytique de départ est :",o:["Ouverte sur la cause, fermée sur le fait à expliquer","Fermée sur l'hypothèse la plus probable","Formulée comme un choix entre deux options","Alignée sur la décision à prendre"],w:"« Qu'est-ce qui explique le passage de 2,1 % à 3,8 % ? » Le fait est précis, la cause reste ouverte."},
{id:"c4",cat:"cad",t:40,q:"« Est-ce un effet de saisonnalité ? » comme question de cadrage :",o:["Trop fermée : si la réponse est non, il ne reste plus de question","Correcte : elle est testable","Correcte si la saisonnalité est l'hypothèse dominante","Trop vague pour être testée"],w:"Une question fermée sur une hypothèse s'épuise avec elle. La question doit survivre à l'élimination de chaque hypothèse."},
{id:"c5",cat:"cad",t:40,q:"Structurer en 3 axes maximum, c'est structurer par :",o:["Attributs observables ou mécanismes, pas par causes supposées","Ordre de probabilité des causes","Facilité d'accès aux données","Impact financier estimé"],w:"Volume, zone, transporteur : trois attributs observables. « Les clients déçus » n'est pas un axe, c'est une hypothèse."},
{id:"c6",cat:"cad",t:40,q:"« Le churn a atteint un seuil qui doit être traité en urgence » comme axe d'analyse :",o:["Ce n'est pas un axe causal, c'est un critère de décision","Un axe valable : il fixe la priorité","Un axe valable s'il est chiffré","Un axe à garder pour la restitution au board"],w:"Un axe d'analyse explique le phénomène. L'urgence ne l'explique pas, elle dit seulement quoi en faire."},
// Points vs pourcents
{id:"p1",cat:"pct",t:45,q:"Une marge brute passe de 62 % à 55 %. La baisse est de :",o:["7 points, soit 11 % en relatif","7 %","11 points","7 points, soit 7 % en relatif"],w:"Écart de taux = points. 7 / 62 ≈ 11 % en relatif. Devant un board, c'est ce chiffre qu'on te reprendra."},
{id:"p2",cat:"pct",t:40,q:"Un taux passe de 2 % à 4 %. C'est :",o:["+2 points, soit un doublement","+2 %","+200 points","+4 points"],w:"Deux points d'écart, +100 % en relatif. « +2 % » laisserait croire à un passage de 2 % à 2,04 %."},
{id:"p3",cat:"pct",t:60,q:"Churn mensuel de 2,1 % à 3,8 % sur 420 clients. Départs supplémentaires par mois :",o:["≈ 7","≈ 16","≈ 9","≈ 2"],w:"1,7 point × 420 ≈ 7. Les 16, c'est le total des départs ; les 9, c'est le niveau habituel. L'excès, c'est la différence."},
{id:"p4",cat:"pct",t:60,q:"Taux dans le créneau de 94 % à 81 %, sur 12 300 livraisons/mois. Livraisons hors créneau en plus :",o:["≈ 1 600","≈ 1 300","≈ 2 300","≈ 740"],w:"13 points × 12 300 ≈ 1 600. Ou : 19 % ≈ 2 340 contre 6 % ≈ 740 avant. 2 300 est le total, pas l'excès."},
{id:"p5",cat:"pct",t:60,q:"CA mensuel 700 000 €, marge brute de 62 % tombée à 55 %. Marge perdue par mois :",o:["≈ 49 000 €","≈ 7 000 €","≈ 77 000 €","≈ 11 000 €"],w:"7 points × 700 000 € = 49 000 €. 77 000 € appliquerait 11 % au CA : c'est le relatif appliqué à la mauvaise base."},
{id:"p6",cat:"pct",t:45,q:"Des ventes progressent de 50 %, puis baissent de 50 %. Par rapport au départ :",o:["−25 %","0 %","−50 %","+25 %"],w:"100 → 150 → 75. Les pourcentages successifs ne s'additionnent pas : la base change entre les deux."},
{id:"p7",cat:"pct",t:60,q:"Churn de 2,1 % par mois sur 420 clients. Sur trois mois, cela représente environ :",o:["≈ 26 départs","≈ 9 départs","≈ 63 départs","≈ 6 départs"],w:"0,021 × 420 ≈ 9 par mois, donc ≈ 26 sur trois mois. 63 serait 2,1 % multiplié par 3 mois puis par… rien de cohérent."},
{id:"p8",cat:"pct",t:70,q:"5 magasins sur 14 perdent 16 points de marge, les 9 autres 1,5 point. Baisse moyenne du réseau (CA comparables) :",o:["≈ 7 points","≈ 9 points","≈ 17,5 points","≈ 2,5 points"],w:"Moyenne pondérée : (5 × 16 + 9 × 1,5) / 14 ≈ 6,7. La moyenne simple des deux groupes (≈ 9) ignore leurs poids."},
{id:"p9",cat:"pct",t:50,q:"Deux chiffres : « 14 % de départs en plus » et « 14 points de taux en plus ». Lequel est le plus grand phénomène ?",o:["Impossible à dire sans la base : ce sont deux grandeurs différentes","Les 14 points, toujours","Les 14 %, toujours","Ils sont équivalents"],w:"14 % de plus sur 100 départs, c'est 14 départs. 14 points sur un taux de 2 %, c'est multiplier par 8. Sans la base, aucune comparaison."},
// Fausse alternative
{id:"a1",cat:"alt",t:45,q:"« J'ai trois hypothèses. H3 est éliminée, donc c'est H1 ou H2. » Ce raisonnement est :",o:["Invalide : rien ne garantit que la liste soit exhaustive","Valide si les trois hypothèses sont plausibles","Valide : éliminer une hypothèse renforce les autres","Invalide : il faudrait aussi éliminer H1 et H2"],w:"Éliminer réduit l'espace des causes possibles, sans démontrer aucune des restantes. Trois hypothèses ne sont pas toutes les hypothèses."},
{id:"a2",cat:"alt",t:45,q:"Le transport est au niveau habituel. Peut-on conclure que le problème est dans l'entrepôt ?",o:["Non : d'autres maillons existent, dont la définition même de la promesse","Oui : si ce n'est pas le transport, c'est la préparation","Oui, à condition de vérifier les quatre dépôts","Non : il faut d'abord changer de transporteur"],w:"Cas Pacty. Transport éliminé, entrepôt supposé : la cause était dans la cible, pas dans l'exécution."},
{id:"a3",cat:"alt",t:40,q:"Éliminer une hypothèse, c'est :",o:["Réduire l'espace des causes possibles, sans en démontrer aucune","Démontrer la plus probable des restantes","Un test non concluant","Confirmer l'hypothèse concurrente"],w:"Une élimination est une information négative. Elle ne se transforme en information positive que si la liste est exhaustive et exclusive."},
{id:"a4",cat:"alt",t:60,q:"Quel énoncé est logiquement valide ?",o:["Si la cause était saisonnière, le même écart existerait en N-1 ; il n'existe pas, donc elle n'est pas saisonnière","Le concurrent n'explique pas le churn, donc la cause est interne","Les trois transporteurs sont au même niveau, donc aucun n'est en cause","Le mix est stable, donc les invendus n'ont pas bougé"],w:"Le premier teste une prédiction de l'hypothèse. Les trois autres concluent sur autre chose que ce qui a été testé."},
{id:"a5",cat:"alt",t:45,q:"Trois hypothèses testées et éliminées. L'étape suivante :",o:["Élargir l'espace des hypothèses, notamment aux actions de l'entreprise elle-même","Retenir la moins improbable des trois","Demander une donnée plus fine sur la plus plausible","Conclure à une cause externe de marché"],w:"Si tout ce que tu as listé est mort, c'est la liste qui était incomplète, pas la réalité."},
{id:"a6",cat:"alt",t:45,q:"« Le canal en ligne ne génère pas plus de no-show que le téléphone, donc les patients sont devenus moins fiables. » Défaut :",o:["Fausse alternative : l'élimination du canal ne valide pas l'hypothèse comportementale","Aucun : l'hypothèse du canal est bien éliminée","Il manque la taille des échantillons","Le téléphone aurait dû être testé en premier"],w:"Deux hypothèses sur la table ne font pas une alternative complète. Il reste tout ce qui n'a pas été nommé."},
// Observable vs cause supposée
{id:"o1",cat:"obs",t:40,q:"Lequel est un attribut observable utilisable pour isoler un sous-groupe ?",o:["Le canal d'acquisition","Les clients sensibles au prix","Les clients déçus par le produit","Les clients mal onboardés"],w:"Canal, cohorte, zone, site, ancienneté : des attributs dans la base. Les trois autres sont des causes supposées déguisées en segments."},
{id:"o2",cat:"obs",t:50,q:"Décomposer les départs en « prix / concurrence / saisonnalité ». Défaut principal :",o:["Chaque case est une hypothèse déguisée en chiffre","Les trois causes ne sont pas exclusives","Il manque une case « autres »","Les proportions ne sont pas mesurables"],w:"La cause est précisément ce qu'on ignore. La découper en cases, c'est supposer la réponse pour la compter."},
{id:"o3",cat:"obs",t:60,q:"11 entretiens de départ sur 48 départs, dont 3 citent le prix. Que peut-on en conclure ?",o:["Rien de quantifié : 37 départs ne sont pas renseignés","Que 27 % des départs sont liés au prix","Que le prix est marginal dans les départs","Que le prix est la cause principale"],w:"3 sur 11 n'est pas 3 sur 48. Les non-interrogés ne sont pas « partis pour autre chose » : on ne sait rien d'eux."},
{id:"o4",cat:"obs",t:45,q:"Pour savoir si un sous-groupe se détache, la bonne demande est :",o:["Le même indicateur découpé par attribut (zone, canal, cohorte, site)","La liste des causes citées par les clients","Un entretien qualitatif approfondi","L'évolution de l'indicateur global sur 24 mois"],w:"Même métrique, découpage par ce qu'on observe. Si un segment porte tout l'écart, la cause est là."},
{id:"o5",cat:"obs",t:45,q:"Le sous-groupe est isolé. L'erreur la plus fréquente à ce stade :",o:["Tester les causes une par une au lieu de demander ce qui distingue ce groupe","Chercher un second sous-groupe","Vérifier la taille du groupe","Recalculer l'indicateur global"],w:"Machine ? Personnel ? Formation ? Une par une, c'est sans fin. « Qu'est-ce que ces sites ont en commun et pas les autres ? » teste tout d'un coup."},
{id:"o6",cat:"obs",t:40,q:"Dans l'espace des hypothèses, qu'oublie-t-on le plus souvent ?",o:["Les actions de l'entreprise elle-même","Les facteurs macroéconomiques","Le comportement des concurrents","La saisonnalité"],w:"Partenariat, laboratoire central, promesse raccourcie : dans trois cas sur trois, la cause était une décision interne que personne n'avait reliée au symptôme."},
{id:"o7",cat:"obs",t:50,q:"Les clients partis sont « ceux qui ont souscrit en T1 et sont dans le Sud ». Cette description est :",o:["Correcte : deux attributs observables, sans cause supposée","Incomplète : il manque la raison du départ","Incorrecte : il faut d'abord qualifier leur insatisfaction","Trop large pour être utile"],w:"Cohorte et zone. La cause vient après, et c'est l'intersection des deux attributs qui la désigne."},
// Contenu de l'indicateur
{id:"i1",cat:"ind",t:40,q:"La marge brute inclut-elle les salaires des équipes en magasin ?",o:["Non : CA moins coût des produits vendus","Oui, s'ils sont affectés à la production","Oui, c'est la marge après coûts directs","Non, mais elle inclut les loyers"],w:"Marge brute = CA − coût des produits vendus. Salaires, loyers, frais généraux viennent après."},
{id:"i2",cat:"ind",t:40,q:"Les invendus pèsent-ils sur la marge brute ?",o:["Oui : matière consommée mais non vendue","Non : ils relèvent des charges d'exploitation","Non : ils n'apparaissent pas en comptabilité","Seulement s'ils sont provisionnés"],w:"Ce qui est produit et jeté a consommé de la matière sans générer de CA. Cas Fournil : 4 % → 20 % du CA."},
{id:"i3",cat:"ind",t:45,q:"Le mix des ventes renseigne-t-il sur les invendus ?",o:["Non : un produit jeté n'apparaît jamais dans les ventes","Oui, indirectement, par la répartition des catégories","Oui, si on le croise avec les volumes produits","Non, mais il donne le coût matière par produit"],w:"Le mix décrit ce qui a été vendu. Une seule donnée ne teste qu'un seul levier."},
{id:"i4",cat:"ind",t:50,q:"Exécution identique, indicateur en chute de 13 points. Qu'est-ce qui a forcément changé ?",o:["La cible : la promesse ou la définition de l'indicateur","Le périmètre des clients mesurés","La fiabilité de la mesure","Le volume traité"],w:"Un taux compare un réalisé à une référence. Si le réalisé est stable, c'est la référence qui a bougé."},
{id:"i5",cat:"ind",t:45,q:"Un indicateur dont la définition a changé en mai. La série janvier-août est :",o:["Non comparable : elle mélange deux règles de calcul","Comparable si le changement est documenté","Comparable après retraitement de la saisonnalité","Comparable, le périmètre étant inchangé"],w:"Deux définitions, deux séries. La première chose à dire au board, avant tout chiffre."},
{id:"i6",cat:"ind",t:40,q:"Avant d'analyser un indicateur, la première question est :",o:["Que contient-il exactement, numérateur et dénominateur ?","Comment a-t-il évolué sur 12 mois ?","Comment se compare-t-il au marché ?","Qui en est responsable ?"],w:"Trois cas sur trois : la métrique ne mesurait pas ce que le fondateur croyait."},
{id:"i7",cat:"ind",t:60,q:"Taux de retour = retours du mois / commandes du mois, avec 30 jours pour retourner. Le risque :",o:["Numérateur et dénominateur ne portent pas sur les mêmes commandes","Le taux est systématiquement sous-estimé","Le taux ne capte pas les échanges","Aucun : les deux se compensent"],w:"Les retours d'avril viennent des commandes de mars. Si le volume varie d'un mois à l'autre, le ratio bouge sans que rien n'ait changé."},
{id:"i8",cat:"ind",t:50,q:"Le marketing a raccourci le créneau promis de 4 h à 2 h. Pour les opérations, le taux de respect :",o:["Chute mécaniquement, à exécution identique","Ne bouge pas si les tournées sont les mêmes","Chute seulement si le transporteur est informé","S'améliore : la contrainte motive"],w:"Cas Pacty. Mesuré à 4 h, le taux était toujours de 93,6 %. Les 13 points perdus étaient un changement de règle."},
// Parcimonie
{id:"r1",cat:"par",t:50,q:"Trois transporteurs indépendants décrochent le même mois, dans les mêmes proportions. Lecture la plus parcimonieuse :",o:["Une cause commune en amont, chez le donneur d'ordre","Trois défaillances simultanées liées au volume d'été","Un effet de marché sur le transport régional","Une dégradation générale de la qualité de service"],w:"Trois entreprises distinctes, un seul récit : ce qu'elles partagent, c'est le client. La cause est chez Pacty."},
{id:"r2",cat:"par",t:50,q:"Cinq magasins, cinq équipes distinctes, perdent leur maîtrise opérationnelle le même mois. À déduire :",o:["La cause est commune et extérieure aux équipes","Les recrutements ont été mal faits partout","La formation interne est défaillante","C'est une coïncidence à documenter"],w:"Cinq coïncidences simultanées, ou une cause unique. Cas Fournil : le laboratoire central."},
{id:"r3",cat:"par",t:40,q:"Entre deux hypothèses de pouvoir explicatif égal, on retient :",o:["Celle qui mobilise le moins de récits séparés","Celle qui est la plus facile à tester","Celle qui correspond à l'intuition du terrain","Celle qui couvre le plus de cas possibles"],w:"À explication égale, moins d'hypothèses auxiliaires. Chaque récit supplémentaire est un point de fragilité."},
{id:"r4",cat:"par",t:50,q:"Une hypothèse explique la concentration géographique mais pas la concentration par cohorte. Elle est :",o:["Insuffisante : une cause valable explique tous les faits observés","Partiellement validée","À retenir faute de mieux","À tester en priorité"],w:"Deux faits, un récit. Une hypothèse qui n'en couvre qu'un t'oblige à en inventer un second : parcimonie violée."},
{id:"r5",cat:"par",t:60,q:"Hypothèse : « départ du commercial local ». Or les clients de plus de 7 mois churnent normalement. Conclusion :",o:["L'hypothèse est morte avant la donnée : elle toucherait tous les clients","L'hypothèse reste plausible pour les clients récents","Il faut vérifier les effectifs pour trancher","L'hypothèse explique la moitié du phénomène"],w:"Un commercial parti affecterait toute sa zone. Le fait « seuls les 4-7 mois churnent » la tue sans donnée supplémentaire."},
{id:"r6",cat:"par",t:50,q:"« Rotation des stocks », « concurrence saisonnière », « bureaux vides en été » comme trois hypothèses distinctes :",o:["Une seule hypothèse sous trois habillages : un effet saisonnier structurel","Trois hypothèses indépendantes à tester séparément","Deux hypothèses, la troisième étant redondante","Trois hypothèses complémentaires"],w:"Toutes décrivent une structure qui existe chaque été. Une seule donnée (N-1) les tue toutes : elles n'en faisaient qu'une."},
// Séquençage
{id:"s1",cat:"seq",t:40,q:"Avant d'interpréter un écart entre régions, la vérification gratuite est :",o:["Le même écart en N-1","La taille des échantillons","La répartition des volumes","Les entretiens de départ"],w:"Si l'écart existait déjà l'an dernier, il est structurel. S'il est nouveau, quelque chose a changé. Une donnée, deux familles d'hypothèses tranchées."},
{id:"s2",cat:"seq",t:45,q:"Une donnée coûteuse tranche deux hypothèses, une gratuite n'en tranche qu'une. On commence par :",o:["La gratuite, puis on réévalue","La coûteuse, pour son pouvoir discriminant","Les deux en parallèle","Celle qui est la plus rapide à obtenir"],w:"Le résultat de la gratuite peut rendre la coûteuse inutile. Épuiser le gratuit avant d'engager le coûteux."},
{id:"s3",cat:"seq",t:40,q:"Demander une donnée sans hypothèse derrière, c'est :",o:["De la pêche : rien ne sera tranché","Un balayage exploratoire utile","Acceptable si la donnée est gratuite","La bonne méthode en début de cas"],w:"Avant de voir le chiffre, savoir ce qu'il confirmerait et ce qu'il tuerait. Sinon on l'interprète après coup, dans le sens qu'on veut."},
{id:"s4",cat:"seq",t:50,q:"Plusieurs hypothèses partagent une variable confondante non contrôlée. L'ordre correct :",o:["Éliminer la confondante, puis interpréter les comparaisons","Comparer les segments, puis contrôler","Tester l'hypothèse la plus probable d'abord","Traiter les deux simultanément"],w:"Donnée filtre avant donnée discriminante. Sinon la comparaison simule une hypothèse sans la confirmer."},
{id:"s5",cat:"seq",t:50,q:"Quelle question teste le plus d'hypothèses internes d'un coup ?",o:["« Qu'est-ce qui a changé sur cette période, ici et pas ailleurs ? »","« Les effectifs ont-ils bougé ? »","« Le process a-t-il été modifié ? »","« L'outil a-t-il changé de version ? »"],w:"Les trois autres testent une cause chacune. La première les contient toutes, et celles auxquelles tu n'as pas pensé."},
{id:"s6",cat:"seq",t:50,q:"Le chiffre d'affaires des restaurants clients, pour un éditeur SaaS, est une donnée :",o:["Inaccessible : elle n'est pas dans la base de l'éditeur","Coûteuse mais obtenable par enquête","Gratuite : elle figure dans le CRM","Disponible via les comptes publics"],w:"Avant d'arbitrer coût contre pouvoir discriminant, vérifier que la donnée existe pour toi. Cas Stocka : le CA client n'existait pas."}

const KEY='playbook-drill-s1';
const EMPTY=()=>({v:1,sessions:0,streak:0,lastDay:null,cats:{},qs:{},history:[],cases:{},misses:[],log:[],
  identity:'',intent:{time:'',anchor:''},target:5,days:{},recite:{},reviews:{},updatedAt:0});
const LOG_MAX=2000;
let S=EMPTY();
function load(){try{const raw=localStorage.getItem(KEY);if(raw){S={...EMPTY(),...JSON.parse(raw)};if(!Array.isArray(S.log))S.log=[];if(!S.intent)S.intent={time:'',anchor:''};if(!S.days)S.days={};if(!S.recite)S.recite={};if(!S.reviews)S.reviews={};if(!S.target)S.target=5;}}catch(e){}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function save(){S.updatedAt=Date.now();saveLocal();schedulePush();}
function logEvent(ev){S.log.push({t:Date.now(),...ev});if(S.log.length>LOG_MAX)S.log.splice(0,S.log.length-LOG_MAX);}
load();
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return iso(new Date());}
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);}
function dayDiff(a,b){if(!a||!b)return 99;return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);}
function dow(s){return new Date(s+'T12:00:00').getDay();} // 0 = dimanche
function mondayOf(s){const w=dow(s);return addDays(s,w===0?-6:1-w);}
function weekKey(s){return 'W'+mondayOf(s);}

  else{el.textContent='Progression : cet appareil';el.className='pill soft';el.title='Enregistrée dans ce navigateur uniquement.';}
}
function snapData(snap){
  if(!snap)return null;
  if(typeof snap.data==='function'){const ex=typeof snap.exists==='function'?snap.exists():snap.exists;if(ex===false)return null;return snap.data()||null;}
  if(typeof snap==='object'){if(snap.exists===false)return null;return snap.data&&typeof snap.data==='object'?snap.data:snap;}
  return null;
}
function mergeRemote(remote){
  if(!(remote&&remote.state&&typeof remote.state==='object'))return false;
  const rt=Number(remote.updatedAt||0),lt=Number(S.updatedAt||0);
  if(rt>lt){S={...EMPTY(),...remote.state,updatedAt:rt};saveLocal();lastPushed=JSON.stringify({state:S,updatedAt:rt});render();return true;}
  if(lt>rt){pushRemote();}else{lastPushed=JSON.stringify({state:S,updatedAt:lt});}
  return true;
}
function schedulePush(){if(syncMode==='local')return;clearTimeout(pushTimer);pushTimer=setTimeout(pushRemote,800);}
function pushRemote(){
  if(syncMode==='local')return;
  const payload={state:S,updatedAt:S.updatedAt||Date.now()};const ser=JSON.stringify(payload);
  if(ser===lastPushed)return;
  const doWrite=syncMode==='db'
    ?()=>dbRef.set(JSON.parse(ser))
    :()=>fetch(`${API_URL}?t=${encodeURIComponent(syncToken())}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:ser}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);});
  writeChain=writeChain.then(doWrite).then(()=>{lastPushed=ser;setSync('synced');}).catch(e=>setSync('error',String(e&&e.message||e)));
}
async function initSync(){
  const timeout=ms=>new Promise(r=>setTimeout(()=>r(null),ms));
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const db=await Promise.race([window.claude.use('db'),timeout(10000)]);
      if(db){dbRef=db.doc('progress/main');syncMode='db';
        const snap=await Promise.race([dbRef.get(),timeout(10000)]);
        if(!mergeRemote(snapData(snap))){if(S.updatedAt)pushRemote();}
        setSync('synced');return;}
    }
    const t=syncToken();
    if(t){
      syncMode='api';
      const r=await Promise.race([fetch(`${API_URL}?t=${encodeURIComponent(t)}`,{cache:'no-store'}),timeout(10000)]);
      if(!r)throw new Error('Pas de réponse du serveur');
      if(r.status===401||r.status===403){syncMode='local';setSync('error','Code de synchronisation refusé');return;}
      if(r.status===404){if(S.updatedAt)pushRemote();setSync('synced');return;}
      if(!r.ok)throw new Error('HTTP '+r.status);
      if(!mergeRemote(await r.json())){if(S.updatedAt)pushRemote();}
      setSync('synced');return;
    }
    setSync('local');
  }catch(e){setSync('error',String(e&&e.message||e));}
}

/* ===================== LOGIQUE D'APPRENTISSAGE ===================== */
function acc(c){const s=S.cats[c];if(!s||s.seen<2)return 0.5;return s.ok/s.seen;}
// Questions ratées récemment (3 derniers jours) et pas réussies depuis : elles reviennent en priorité (clôture + espacement).
function recentMisses(){
  const t=today(),out=new Set();
  S.misses.forEach(m=>{if(dayDiff(m.d,t)<=3)out.add(m.id);});
  S.log.slice(-200).forEach(e=>{if(e.k==='q'&&e.ok&&out.has(e.id)){const m=S.misses.filter(x=>x.id===e.id).pop();if(m&&e.t>new Date(m.d+'T23:59:59').getTime())out.delete(e.id);}});
  return out;
}
function pick(n){
  const rm=recentMisses();
  const pool=Q.map(q=>{let w=1.3-acc(q.cat);const r=S.qs[q.id];
    if(rm.has(q.id))w*=2.5;else{if(r&&S.sessions-r.last<3)w*=0.3;if(r&&r.seen>=2&&r.ok===r.seen)w*=0.6;}
    return{q,w};});
  const out=[],cnt={};
  while(out.length<n&&pool.length){
    const tot=pool.reduce((s,p)=>s+p.w,0);let r=Math.random()*tot,i=0;
    for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break;}
    i=Math.min(i,pool.length-1);const q=pool[i].q;out.push(q);pool.splice(i,1);
    cnt[q.cat]=(cnt[q.cat]||0)+1;if(cnt[q.cat]>=3){for(let k=pool.length-1;k>=0;k--)if(pool[k].q.cat===q.cat)pool.splice(k,1);}
  }
  return out;
}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function eaScore(ok,n){return n?100+Math.round(100*ok/n):null;}
function weakest(){let w=null,v=2;for(const c in CATS){const s=S.cats[c];if(!s||s.seen<2)continue;const a=s.ok/s.seen;if(a<v){v=a;w=c;}}return w;}
function mastered(){return Object.keys(CATS).filter(c=>{const s=S.cats[c];return s&&s.seen>=6&&s.ok/s.seen>=0.8;}).length;}

/* ===================== RYTHME ET ENGAGEMENT =====================
   Techniques reprises du playbook persuasion & influence, dans leur version utile à l'apprentissage :
   identité, intention d'implémentation, objectif hebdomadaire choisi, streak avec joker, reprise sans dette,
   bilan écrit du vendredi, prochaine action prescrite, erreurs qui reviennent, lecture par Claude le lundi. */
function activeDay(s){const d=S.days[s];return !!(d&&(d.drill||d.case));}
function markDay(kind){const t=today();S.days[t]=S.days[t]||{drill:0,case:0};S.days[t][kind]++;S.lastDay=t;S.streak=streak();}
function streak(){ // jours consécutifs avec activité ; un jour manqué par semaine est pardonné (joker)
  const t=today();let d=activeDay(t)?t:addDays(t,-1),n=0,jok={};
  for(let i=0;i<400;i++){
    if(activeDay(d)){n++;}else{const wk=weekKey(d);if(!jok[wk]&&n>0){jok[wk]=true;}else break;}
    d=addDays(d,-1);
  }
  return n;
}
function weekDone(){const m=mondayOf(today());let n=0;for(let i=0;i<7;i++){const s=addDays(m,i);if(S.days[s]&&S.days[s].drill)n++;}return n;}
function gapDays(){return S.lastDay?dayDiff(S.lastDay,today()):0;}
function doneToday(){const d=S.days[today()];return !!(d&&d.drill);}
function weekCaseDone(){const m=mondayOf(today());return Object.values(S.cases).some(r=>r.d>=m);}
function planN(){return (S.lastDay&&gapDays()>=3)?6:10;}
function reciteRate(){const v=Object.values(S.recite);if(!v.length)return null;return Math.round(100*v.filter(x=>x==='all').length/v.length);}

function endDrill(){

    const r=S.qs[it.q.id]||{seen:0,ok:0,last:0};r.seen++;r.last=S.sessions;
    if(it.ok){ok++;S.cats[c].ok++;r.ok++;cats[c].ok++;}else{S.misses.push({d,id:it.q.id,c});}

  });
  if(S.misses.length>80)S.misses=S.misses.slice(-80);

  const c=cs.c;
  if(cs.i+1<c.steps.length){cs.i++;cs.chosen=null;cs.order=shuffle([0,1,2,3]);setView('casplay');}
  else{const score=cs.picks.reduce((s,p)=>s+p,0),max=2*c.steps.length;S.cases[c.id]={score,max,d:today(),picks:cs.picks};markDay('case');logEvent({k:'case',id:c.id,score,max});save();setView('casend');}
}
function casPick(k){if(!cs||cs.chosen!==null)return;cs.chosen=k;cs.picks.push(cs.c.steps[cs.i].o[cs.order[k]].s);render();}
function casend(){
  const c=cs.c,r=S.cases[c.id];
  return '<div class="card" style="text-align:center"><p class="note">'+c.title+'</p><div class="score m">'+r.score+' / '+r.max+'</div>'+
  '<p class="note">Étapes : '+r.picks.map(p=>p===2?'●':p===1?'◐':'○').join(' ')+'</p></div>'+
  '<div class="card"><h2>Débrief</h2><p class="brief">'+esc(c.debrief)+'</p><button class="btn ghost" data-a="gocas">Retour aux cas</button></div>';
}

function stats(){
  const n=S.history.reduce((s,h)=>s+h.n,0),ok=S.history.reduce((s,h)=>s+h.ok,0);const it=S.intent||{};const m=mastered();
  let h='<div class="tiles"><div class="tile"><div class="n m">'+S.sessions+'</div><div class="l">séries</div></div><div class="tile"><div class="n m">'+n+'</div><div class="l">questions</div></div><div class="tile"><div class="n m">'+(n?Math.round(100*ok/n)+' %':'—')+'</div><div class="l">réussite</div></div></div>';
  h+='<div class="card"><h3 style="margin-top:0">Palier Bloc 2</h3><p class="note">Condition de passage : les 8 catégories à 80 % ou plus, sur au moins 6 questions chacune. Aujourd\'hui : <b class="m">'+m+' / 8</b>.</p><div class="bars"><div class="b"><div class="t"><i style="width:'+(100*m/8)+'%"></i></div></div></div></div>';
  if(S.history.length){h+='<div class="card"><h3 style="margin-top:0">Scores des dernières séries</h3><div class="hist">'+S.history.slice(-20).map(x=>'<i style="height:'+Math.max(5,(x.score-100))+'%" title="'+x.d+' · '+x.score+'"></i>').join('')+'</div></div>';}
  h+='<div class="card bars"><h3 style="margin-top:0">Par catégorie</h3>';
  for(const c in CATS){const s=S.cats[c];const a=s&&s.seen?Math.round(100*s.ok/s.seen):null;
    h+='<div class="b"><div class="l"><span>'+CATS[c].n+'</span><span class="note m">'+(a===null?'—':a+' % · '+s.seen+' q')+'</span></div><div class="t"><i class="'+(a===null?'':a<60?'lo':a<80?'md':'')+'" style="width:'+(a||0)+'%"></i></div></div>';}
  h+='</div>';
  const ids=Object.keys(S.cases);
  if(ids.length){h+='<div class="card"><h3 style="margin-top:0">Cas</h3>'+ids.map(id=>{const c=CASES.find(x=>x.id===id);const r=S.cases[id];return '<p style="font-size:.95rem">'+(c?c.title:id)+' : <b class="m">'+r.score+' / '+r.max+'</b> <span class="note">· '+r.d+'</span></p>';}).join('')+'</div>';}
  // Engagement
  h+='<div class="card"><h3 style="margin-top:0">Mon engagement</h3>'+
  '<div class="field"><label for="id-line">Ma phrase d\'identité</label><input type="text" id="id-line" value="'+esc(S.identity||'').replace(/"/g,'&quot;')+'" placeholder="'+ID_DEFAULT.replace(/"/g,'&quot;')+'"></div>'+
  '<div class="row" style="margin-top:8px"><div class="field" style="flex:1"><label for="it-time">Heure de la série</label><input type="text" id="it-time" value="'+esc(it.time||'').replace(/"/g,'&quot;')+'" placeholder="7 h 30"></div>'+
  '<div class="field" style="flex:2"><label for="it-anchor">Juste après… (une habitude déjà en place)</label><input type="text" id="it-anchor" value="'+esc(it.anchor||'').replace(/"/g,'&quot;')+'" placeholder="le café, le trajet, le dîner"></div></div>'+
  '<div class="field" style="margin-top:8px"><label>Séries par semaine, choisies par toi</label><div class="row">'+[3,4,5].map(k=>'<button class="btn'+((S.target||5)===k?' primary':'')+'" data-a="target" data-k="'+k+'">'+k+'</button>').join('')+'</div></div>'+
  '<button class="btn primary big" id="eng-save">Enregistrer</button>'+
  (reciteRate()!==null?'<p class="note" style="margin-top:10px">Familles récitées sans faute : '+reciteRate()+' % des jours.</p>':'')+'</div>';
  const rk=Object.keys(S.reviews).sort().pop();
  if(rk){const r=S.reviews[rk];h+='<div class="card"><h3 style="margin-top:0">Dernier bilan</h3><p class="note">Marché : '+esc(r.worked||'–')+'<br>Bloqué : '+esc(r.blocked||'–')+'<br>Heure retenue : '+esc(r.next||'–')+'</p></div>';}
  h+='<div class="card"><h3 style="margin-top:0">Synchronisation</h3><p class="note">'+(syncMode==='db'?'Synchronisée via l\'artefact Claude.':syncMode==='api'?'Synchronisée avec le serveur : Claude lit directement ta progression en séance.':'Progression enregistrée dans ce navigateur. Entre le code de synchronisation (affiché à l\'installation du serveur) pour la retrouver sur tous tes appareils.')+'</p>'+
  (syncMode==='db'?'':'<div class="row" style="align-items:flex-end"><div class="field" style="flex:1"><label for="sync-code">Code de synchronisation</label><input type="text" id="sync-code" value="'+syncToken().replace(/"/g,'&quot;')+'" autocomplete="off" placeholder="collé une seule fois"></div><button class="btn" id="sync-save">Activer</button></div>')+
  '</div>'+
  '<div class="card"><button class="btn ghost" data-a="reset" style="margin-top:0">Réinitialiser la progression</button></div>';
  return h;
}

function bind(){
  app.querySelectorAll('[data-a]').forEach(b=>{b.onclick=()=>{const a=b.dataset.a;
    if(a==='startdrill')startDrill();else if(a==='ans')answer(+b.dataset.k);else if(a==='next')nextQ();
    else if(a==='recite-all'){S.recite[today()]='all';logEvent({k:'recite',r:'all'});save();startDrillNow();}
    else if(a==='recite-miss'){S.recite[today()]='partial';logEvent({k:'recite',r:'partial'});save();reciteMiss=true;render();}
    else if(a==='recite-go'){reciteMiss=false;startDrillNow();}
    else if(a==='gocas'){cs=null;setView('cas');}else if(a==='gostats')setView('stats');
    else if(a==='startcas')startCase(b.dataset.id);else if(a==='casnext')casNext();else if(a==='caspick')casPick(+b.dataset.k);
    else if(a==='target'){S.target=+b.dataset.k;save();render();}
    else if(a==='reset'){if(b.dataset.c){S=EMPTY();save();setView('stats');}else{b.textContent='Confirmer la réinitialisation';b.dataset.c='1';}}
  };});
  const ss=document.getElementById('sync-save');
  if(ss)ss.onclick=()=>{setSyncToken(document.getElementById('sync-code').value);lastPushed='';initSync().then(()=>{if(view==='stats')render();});};
  const es=document.getElementById('eng-save');
  if(es)es.onclick=()=>{S.identity=document.getElementById('id-line').value.trim();S.intent={time:document.getElementById('it-time').value.trim(),anchor:document.getElementById('it-anchor').value.trim()};logEvent({k:'engage'});save();es.textContent='Enregistré';setTimeout(()=>{if(view==='stats')render();},700);};
  const rs=document.getElementById('rv-save');
  if(rs)rs.onclick=()=>{const wk=weekKey(today());S.reviews[wk]={worked:document.getElementById('rv-worked').value.trim(),blocked:document.getElementById('rv-blocked').value.trim(),next:document.getElementById('rv-next').value.trim(),at:Date.now()};
    const nx=S.reviews[wk].next;if(nx)S.intent={time:nx,anchor:(S.intent||{}).anchor||''};logEvent({k:'review',wk});save();render();};
}

/* ===================== DÉMARRAGE ===================== */
S.streak=streak();
render();
initSync();
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{});let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloaded){reloaded=true;location.reload();}});}catch(e){}}
</script>
</body>
</html>
