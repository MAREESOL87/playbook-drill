# Playbook Drill : drill.eldwin-uk.com
# Statique servi par nginx, API de synchronisation relayée vers le service Python (127.0.0.1:8789).
# HTTPS : après activation du site, lancer  sudo certbot --nginx -d drill.eldwin-uk.com
server {
    listen 80;
    listen [::]:80;
    server_name drill.eldwin-uk.com;

    root /opt/playbook-drill/public;
    index index.html;

    # Le service worker et la page doivent toujours être revalidés, sinon les mises à jour du lundi n'arrivent pas.
    location = /sw.js            { add_header Cache-Control "no-cache, must-revalidate"; try_files $uri =404; }
    location = /index.html       { add_header Cache-Control "no-cache, must-revalidate"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { application/manifest+json webmanifest; } try_files $uri =404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 2m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/playbook-drill.access.log;
    error_log  /var/log/nginx/playbook-drill.error.log;
}
